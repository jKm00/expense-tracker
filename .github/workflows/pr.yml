name: PR Verification

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  verify-web:
    name: Verify web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm vitest run --reporter=default --reporter=html --outputFile=./test-results/vitest-report.html

      - name: Upload web test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: apps/web/test-results/vitest-report.html
          if-no-files-found: warn

  build-job:
    name: Build job
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build
